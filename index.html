<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>ColorVerse — See Your Palette in Context</title>
    <meta name="description" content="Stop guessing how a color palette will look. ColorVerse shows every palette applied to real mockups — landing pages, slides, social posts, shop listings. Free." />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://colorverse.byigit.dev/" />
    <meta property="og:title" content="ColorVerse — See Your Palette in Context" />
    <meta property="og:description" content="Stop guessing how a color palette will look. See every palette applied to landing pages, slides, social posts, and shop listings — before you commit a hex code." />
    <meta property="og:image" content="https://colorverse.byigit.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="ColorVerse" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://colorverse.byigit.dev/" />
    <meta name="twitter:title" content="ColorVerse — See Your Palette in Context" />
    <meta name="twitter:description" content="Stop guessing how a color palette will look. See every palette applied to real mockups — free." />
    <meta name="twitter:image" content="https://colorverse.byigit.dev/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://colorverse.byigit.dev/" />

    <!-- Fonts: Inter (body) + Fraunces (display hero) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
